name: Selenium Automation

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  schedule:
    - cron: '0 1 * * *'

  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [ chrome, firefox]

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Execute Tests
        run: |
          mvn clean test \
          -Dbrowser=chrome \
          -Dexecution.type=remote \
          -Dgrid.url=http://localhost:4444

      - name: Generate Allure Report
        if: always()
        run: |
            mvn allure:report

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

    services:
      selenium:
        image: selenium/standalone-chrome:4.34.0
        ports:
          - 4444:4444
    